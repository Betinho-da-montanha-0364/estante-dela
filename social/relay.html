<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>relay</title></head>
<body style="font:14px sans-serif;padding:16px"><div id="s">...</div>
<script>
const q=new URLSearchParams(location.search), role=q.get('role'), key=q.get('k')||'img';
const S=t=>document.getElementById('s').textContent=t;
const db=()=>new Promise((res,rej)=>{const r=indexedDB.open('relay',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const put=async(k,v)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const get=async k=>{const d=await db();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
if(role==='src'){
  addEventListener('message',async e=>{ if(!e.data||e.data.type!=='img')return; await put(e.data.k||key,{blob:e.data.blob,name:e.data.name}); S('salvo '+(e.data.k||key)+' '+e.data.blob.size); e.source.postMessage({type:'ack',k:e.data.k||key},'*'); });
  if(opener) opener.postMessage({type:'ready'},'*'); S('pronto (src)');
} else {
  (async()=>{ const v=await get(key); if(!v){S('nada em '+key); opener&&opener.postMessage({type:'missing',k:key},'*'); return}
    let n=0; const iv=setInterval(()=>{ if(++n>40){clearInterval(iv);return} opener&&opener.postMessage({type:'img',k:key,blob:v.blob,name:v.name},'*'); },500);
    addEventListener('message',e=>{ if(e.data&&e.data.type==='ack'){clearInterval(iv);S('entregue');setTimeout(()=>close(),300)} });
    S('enviando '+key); })();
}
</script></body></html>
